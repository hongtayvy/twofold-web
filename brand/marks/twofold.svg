<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30.19 4.67 354.65 354.65" width="128" height="128">
  <!-- TwoFold mark: the origami "2" from the brand kit (brand/reference/lockup.webp).

       Traced by measurement, not by eye. One silhouette of 14 straight edges with
       filleted corners (outer ~9.5-14 lockup px, inner notch corners near-sharp),
       split into facets by four fitted creases:
         C1  -87.2 deg  apricot | light facet          (rms 0.16 px)
         C2  -30.2 deg  light facet | dark band        (rms 0.27 px)
         C3    0.1 deg  dark band | light base         (rms 0.10 px)
         C4  -40.6 deg  light base | dark base         (rms 0.24 px)
       Each facet is the silhouette cut by half-planes, so neighbouring facets share
       edges exactly and cannot seam. The apricot plane overlaps the light facet by
       0.4 px so no dark hairline shows along C1.

       Pixel agreement with the source: silhouette 99.7%, apricot 99.5%, dark 98.1%,
       light 94.9% (the source's anti-aliasing halos count against light).

       Palette only, per the kit: apricot-400 #E3A377, jade-400 #7CBC9E, jade-700 #2E6552.
       Square viewBox, so it drops into any square slot. -->
